<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c62828">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bilans">
  <meta name="format-detection" content="telephone=no">
  <title>Prise de bilans</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">+</span>
      <span>Prise de bilans</span>
    </div>
    <button type="button" class="btn-ghost" id="btn-new" title="Effacer et commencer un nouveau bilan">Nouveau</button>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Étapes du bilan"></nav>

  <main id="main">
    <div id="panels"></div>
    <section class="panel" id="panel-bilan" role="tabpanel" hidden>
      <div class="group">
        <h2>Bilan</h2>
        <p class="hint">
          Aucune donnée n’est envoyée sur Internet. Enregistrez le bilan dans l’app Notes
          via « Partager », puis copiez-collez chaque partie dans ARGOS.
        </p>
        <div class="actions">
          <button type="button" class="btn primary" id="btn-share">Enregistrer dans Notes</button>
          <button type="button" class="btn" id="btn-copy-all">Copier tout</button>
          <button type="button" class="btn" id="btn-download">Fichier .txt</button>
        </div>
        <div id="missing" class="missing" hidden></div>
      </div>
      <div id="report-sections"></div>
    </section>
  </main>

  <footer class="bottombar">
    <button type="button" class="btn" id="btn-prev">‹ Précédent</button>
    <button type="button" class="btn primary" id="btn-next">Suivant ›</button>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
